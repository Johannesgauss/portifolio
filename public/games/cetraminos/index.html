<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cetraminos - WebAssembly Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
    }
    canvas#canvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      outline: none;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    #status-overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      max-width: 580px;
      z-index: 10;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #27272a;
      border-radius: 1rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background-color: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #c084fc;
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.5rem;
      color: #fafafa;
      margin-bottom: 0.75rem;
    }
    p {
      color: #a1a1aa;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1rem 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    
    <div id="status-overlay">
      <div class="badge">Cetraminos • WebAssembly</div>
      <h2>Loading Cetraminos...</h2>
      <div class="spinner"></div>
      <p id="status-text">Initializing WebAssembly & SDL2 runtime...</p>
    </div>
  </div>

  <script>
    var statusOverlay = document.getElementById('status-overlay');
    var statusText = document.getElementById('status-text');
    var canvas = document.getElementById('canvas');

    var Module = {
      preRun: [],
      postRun: [],
      print: function(text) {
        console.log('[Cetraminos]:', text);
      },
      printErr: function(text) {
        console.error('[Cetraminos Error]:', text);
      },
      canvas: (function() {
        return canvas;
      })(),
      setStatus: function(text) {
        if (!text) {
          if (statusOverlay) statusOverlay.style.display = 'none';
          canvas.focus();
        } else {
          if (statusText) statusText.innerText = text;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left === 0 && statusOverlay) {
          statusOverlay.style.display = 'none';
          canvas.focus();
        }
      },
      onRuntimeInitialized: function() {
        if (statusOverlay) statusOverlay.style.display = 'none';
        canvas.focus();
      },
      locateFile: function(path, prefix) {
        return prefix + path;
      }
    };


    // Load compiled Cetraminos WebAssembly script
    var script = document.createElement('script');
    script.src = 'Cetraminos.js';
    script.onload = function() {
      console.log('Cetraminos.js loaded!');
    };
    script.onerror = function() {
      if (statusText) {
        statusText.innerHTML = 'Run <code>./build-cetraminos.sh</code> in the project root to build.';
      }
    };
    document.body.appendChild(script);

    // Focus canvas and unlock Web Audio on user gesture
    function resumeWebAudio() {
      canvas.focus();
      if (typeof SDL2 !== 'undefined' && SDL2.audioContext && SDL2.audioContext.state === 'suspended') {
        SDL2.audioContext.resume();
      }
    }
    window.addEventListener('click', resumeWebAudio);
    window.addEventListener('keydown', resumeWebAudio);
    window.addEventListener('touchstart', resumeWebAudio);
  </script>
</body>
</html>
